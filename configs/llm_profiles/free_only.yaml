default:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.7
  max_tokens: 1000

agents:
  stylist:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.8
    max_tokens: 2000
    fallback:
      provider: groq
      model: llama-3.3-70b-versatile

  story_architect:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.6
    max_tokens: 2000
    fallback:
      provider: groq
      model: llama-3.3-70b-versatile

  visionary:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.9
    max_tokens: 800

  event_extractor:
    provider: ollama
    model: qwen2.5:3b
    temperature: 0.1
    max_tokens: 800
    response_format: json
