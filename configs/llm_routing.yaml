default:
  provider: groq
  model: llama-3.1-8b-instant
  temperature: 0.7
  max_tokens: 1000

agents:
  stylist:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.8
    max_tokens: 2000
    fallback:
      provider: groq
      model: llama-3.3-70b-versatile

  scene_architect:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.6
    max_tokens: 1500

  story_architect:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.6
    max_tokens: 2000

  continuity:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.2
    max_tokens: 1000

  devil_advocate:
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.6
    max_tokens: 800

  visionary:
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.9
    max_tokens: 800

  emotion_guardian:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.5
    max_tokens: 800

  editor:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.4
    max_tokens: 1500

  quality_evaluator:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.2
    max_tokens: 600
    response_format: json

  beta_reader:
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.5
    max_tokens: 600
    response_format: json

  event_extractor:
    provider: ollama
    model: qwen2.5:3b
    temperature: 0.1
    max_tokens: 800
    response_format: json
    fallback:
      provider: groq
      model: llama-3.1-8b-instant
